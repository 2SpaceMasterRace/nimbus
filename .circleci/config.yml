version: 2.1

#Repeatable Python Executor
executors:
  python-executor:
    docker:
      - image: cimg/python:3.12.11
    environment:
      UV_PYTHON_DOWNLOADS: never

#Modular Commands 
commands:
  setup-uv:
    description: "Installs and configures uv - our package manager"
    steps:
      - restore_cache:
          keys:
            - uv-cli-v2-{{ arch }}
      - run: 
          name: Install uv
          command: |
            if [ -x "$HOME/.cargo/bin/uv" ]; then
              echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
              source $BASH_ENV
              uv --version
              exit 0
            fi
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            uv --version
      - save_cache:
          key: uv-cli-v2-{{ arch }}
          paths:
            - ~/.cargo/bin/uv
            - ~/.cargo/bin/uvx

  restore-uv-cache:
    description: "Restore cached uv artifacts"
    steps:
      - restore_cache:
          keys:
            - uv-cache-v2-py312-{{ arch }}-{{ checksum "uv.lock" }}

  save-uv-cache:
    description: "Save cached uv artifacts"
    steps:
      - save_cache:
          key: uv-cache-v2-py312-{{ arch }}-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

  install-dependencies:
    description: "Use UV to install the dependencies"
    steps:
      - run:
          name: Sync dependencies
          command: |
            python_path="$(command -v python)"
            "$python_path" -c 'import sys; print(sys.executable); print(sys.version); raise SystemExit(0 if sys.version_info >= (3, 12) else 1)'
            uv sync --frozen --all-packages --all-groups --python "$python_path"
  restore-fly-cache:
    description: "Restore cached flyctl binary"
    steps:
      - restore_cache:
          keys:
            - flyctl-v2-{{ arch }}
  save-fly-cache:
    description: "Save cached flyctl binary"
    steps:
      - save_cache:
          key: flyctl-v2-{{ arch }}
          paths:
            - ~/.fly/bin/flyctl
  fly-setup:
    description: "Install and configure flyctl"
    steps:
      - restore-fly-cache
      - run:
          name: Install flyctl
          command: |
            echo 'export FLYCTL_INSTALL="$HOME/.fly"' >> $BASH_ENV
            echo 'export PATH="$HOME/.fly/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            if [ -x "$HOME/.fly/bin/flyctl" ]; then
              flyctl version
              exit 0
            fi
            curl -L https://fly.io/install.sh | FLYCTL_INSTALL="$HOME/.fly" sh -s -- --non-interactive
            flyctl version

jobs:
  lint:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - restore-uv-cache
      - install-dependencies
      - save-uv-cache
      - run: 
          name: Ruff Check
          command: |
            uv run ruff check 
      - run:
          name: Ruff — format check
          command: uv run ruff format --check .
      - run:
          name: Mypy — strict type checking
          command: uv run mypy --strict .

  docs-build:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - restore-uv-cache
      - install-dependencies
      - run:
          name: Build Sphinx docs
          command: |
            uv run sphinx-build docs/source docs/build/html
            test -f docs/build/html/index.html
      - store_artifacts:
          path: docs/build/html
          destination: docs/html
  
  unit-tests:
    executor: python-executor
    parallelism: 4
    steps:
      - checkout
      - setup-uv
      - restore-uv-cache
      - install-dependencies
      - run:
          name: Split and run component unit tests with coverage
          command: |
            mkdir -p coverage-data test-results/unit split-tests
            circleci tests glob "src/**/tests/test_*.py" | circleci tests run \
              --command="xargs -n 1 echo > split-tests/unit-${CIRCLE_NODE_INDEX}.txt" \
              --split-by=timings \
              --timings-type=filename \
              --verbose
            if [ ! -s "split-tests/unit-${CIRCLE_NODE_INDEX}.txt" ]; then
              touch "coverage-data/.coverage.unit.${CIRCLE_NODE_INDEX}.empty"
              exit 0
            fi
            xargs uv run coverage run --data-file="coverage-data/.coverage.unit.${CIRCLE_NODE_INDEX}" -m pytest \
              -o addopts="--import-mode=importlib" \
              -m "unit or regression" \
              --junitxml="test-results/unit/results-${CIRCLE_NODE_INDEX}.xml" \
              -q < "split-tests/unit-${CIRCLE_NODE_INDEX}.txt"
      - store_test_results:
          path: test-results/unit
      - persist_to_workspace:
          root: .
          paths:
            - coverage-data
  property-tests:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - restore-uv-cache
      - install-dependencies
      - run:
          name: Run Hypothesis property-based tests
          command: |
            mkdir -p coverage-data test-results/property
            uv run coverage run --data-file=coverage-data/.coverage.property -m pytest \
              -o addopts="--import-mode=importlib" \
              -m property \
              --junitxml=test-results/property/results.xml \
              -q
      - store_test_results:
          path: test-results/property
      - persist_to_workspace:
          root: .
          paths:
            - coverage-data

  fuzz-smoke:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - restore-uv-cache
      - install-dependencies
      - run:
          name: Fuzz smoke — conversation deserialisation
          command: PYTHONFUZZ_NO_ATHERIS=1 uv run python fuzz/fuzz_conversation.py
      - run:
          name: Fuzz smoke — session-ID validation
          command: PYTHONFUZZ_NO_ATHERIS=1 uv run python fuzz/fuzz_session_id.py
      - run:
          name: Fuzz smoke — request-state deserialisation
          command: PYTHONFUZZ_NO_ATHERIS=1 uv run python fuzz/fuzz_request_state.py

  bdd-tests:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - restore-uv-cache
      - install-dependencies
      - run:
          name: Run BDD acceptance tests
          command: |
            mkdir -p test-results/bdd
            uv run pytest \
              -o addopts="--import-mode=importlib" \
              tests/bdd \
              --junitxml=test-results/bdd/results.xml \
              -q --no-cov
      - store_test_results:
          path: test-results/bdd

  integration-tests:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - restore-uv-cache
      - install-dependencies
      - run:
          name: Run integration tests (DI wiring verification)
          command: |
            mkdir -p coverage-data test-results/integration
            uv run coverage run --data-file=coverage-data/.coverage.integration -m pytest \
              -o addopts="--import-mode=importlib" \
              tests/integration/ \
              --junitxml=test-results/integration/results.xml \
              -q
      - store_test_results:
          path: test-results/integration
      - persist_to_workspace:
          root: .
          paths:
            - coverage-data

  e2e-tests:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - restore-uv-cache
      - install-dependencies
      - run:
          name: Run CircleCI-safe E2E tests
          command: |
            mkdir -p test-results/e2e
            uv run pytest \
              -o addopts="--import-mode=importlib" \
              tests/e2e \
              -m "e2e and circleci and not local_credentials" \
              --junitxml=test-results/e2e/results.xml \
              -q
      - store_test_results:
          path: test-results/e2e

  ai-e2e-tests:
    executor: python-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup-uv
      - restore-uv-cache
      - install-dependencies
      - fly-setup
      - run:
          name: Run ai_server e2e tests with retries and rollback
          command: |
            mkdir -p test-results/ai-e2e
            cat ci-state/fly-context.env >> $BASH_ENV
            source ci-state/fly-context.env
            attempt=1
            max_attempts=3
            until RUN_AI_SERVER_E2E=1 AI_SERVER_BASE_URL="$FLY_BASE_URL" uv run pytest \
              -o addopts="--import-mode=importlib" \
              src/ai_server/tests/test_e2e.py \
              -m e2e \
              --junitxml=test-results/ai-e2e/results.xml \
              -q; do
              status=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                scripts/ci/rollback_fly_release.sh ci-state/fly-context.env || true
                exit "$status"
              fi
              sleep $((attempt * 20))
              attempt=$((attempt + 1))
            done
      - store_test_results:
          path: test-results/ai-e2e

  coverage-gate:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - attach_workspace:
          at: .
      - run:
          name: Combine coverage and enforce project threshold
          command: |
            mkdir -p coverage
            python_path="$(command -v python)"
            uvx --python "$python_path" --from coverage coverage combine --data-file=.coverage coverage-data/.coverage.*
            uvx --python "$python_path" --from coverage coverage report
            uvx --python "$python_path" --from coverage coverage xml --data-file=.coverage -o coverage/combined-coverage.xml
            uvx --python "$python_path" --from coverage coverage html --data-file=.coverage -d coverage/combined-html
      - store_artifacts:
          path: coverage/combined-html
          destination: coverage/combined

  deploy-fly:
    executor: python-executor
    steps:
      - checkout
      - fly-setup
      - save-fly-cache
      - run:
          name: Capture rollback target
          command: |
            mkdir -p ci-state
            flyctl releases --config fly.toml --json --image > ci-state/releases-before-deploy.json
            python scripts/ci/write_fly_context.py --config fly.toml --releases-json ci-state/releases-before-deploy.json > ci-state/fly-context.env
            cat ci-state/fly-context.env >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Deploy to Fly.io
          command: |
            source ci-state/fly-context.env
            set +e
            flyctl deploy \
              --app "$FLY_APP" \
              --remote-only \
              --config fly.toml \
              --yes \
              --strategy immediate \
              --wait-timeout 15m \
              --deploy-retries 2
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              flyctl status --app "$FLY_APP" --config fly.toml || true
              scripts/ci/rollback_fly_release.sh ci-state/fly-context.env || true
              exit "$status"
            fi
      - run:
          name: Start newly created Fly machines
          command: |
            source ci-state/fly-context.env
            flyctl machines list --app "$FLY_APP" --config fly.toml --json > ci-state/machines-after-deploy.json
            created_app_machines="$(python - \<<'PY'
            import json

            with open("ci-state/machines-after-deploy.json", encoding="utf-8") as file:
                machines = json.load(file)

            for machine in machines:
                config = machine.get("config") or {}
                env = config.get("env") or {}
                metadata = config.get("metadata") or {}
                process_group = env.get("FLY_PROCESS_GROUP") or metadata.get("fly_process_group")
                if machine.get("state") == "created" and process_group == "app":
                    print(machine["id"])
            PY
            )"
            for machine_id in $created_app_machines; do
              flyctl machine start "$machine_id" --app "$FLY_APP" --config fly.toml
            done
      - run:
          name: Capture deployed release status
          command: |
            source ci-state/fly-context.env
            flyctl status --app "$FLY_APP" --config fly.toml --json > ci-state/status-after-deploy.json
      - persist_to_workspace:
          root: .
          paths:
            - ci-state

  verify-fly-deploy:
    executor: python-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup-uv
      - restore-uv-cache
      - install-dependencies
      - fly-setup
      - run:
          name: Load deployed Fly context
          command: |
            cat ci-state/fly-context.env >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Wait for app to be healthy
          command: |
            source ci-state/fly-context.env
            attempt=1
            max_attempts=12
            until curl -sf "$FLY_BASE_URL/health" -H "X-Forwarded-Proto: https" >/dev/null; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Timed out waiting for $FLY_BASE_URL/health"
                exit 1
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
      - run:
          name: Verify mounted Fly session volume with retries
          command: |
            source ci-state/fly-context.env
            attempt=1
            max_attempts=5
            volume_check="/bin/sh -c 'mkdir -p /data/sessions && test -d /data/sessions && test -w /data/sessions'"
            until flyctl ssh console --app "$FLY_APP" --config fly.toml -C "$volume_check"; do
              status=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                scripts/ci/rollback_fly_release.sh ci-state/fly-context.env || true
                exit "$status"
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
      - run:
          name: Verify deployed Nimbus routes with retries
          command: |
            source ci-state/fly-context.env
            attempt=1
            max_attempts=5
            until uv run python scripts/ci/verify_deployed_nimbus.py --base-url "$FLY_BASE_URL" --signing-secret "$AI_SERVER_SIGNING_SECRET"; do
              status=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                scripts/ci/rollback_fly_release.sh ci-state/fly-context.env || true
                exit "$status"
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done

workflows:
  main:
    jobs:
      - lint
      - docs-build
      - unit-tests
      - property-tests
      - fuzz-smoke
      - bdd-tests
      - integration-tests
      - coverage-gate:
          requires:
            - unit-tests
            - property-tests
            - bdd-tests
            - integration-tests
      - e2e-tests:
          requires:
            - lint
            - coverage-gate
          filters:
            branches:
              only: hw-3
      - ai-e2e-tests:
          context:
            - flyio
            - openrouter
          requires:
            - verify-fly-deploy
          filters:
            branches:
              only: hw-3
      - deploy-fly:
          context: flyio
          requires:
            - lint
            - docs-build
            - coverage-gate
            - e2e-tests
          filters:
            branches:
              only: hw-3
      - verify-fly-deploy:
          context:
            - flyio
            - openrouter
          requires:
            - deploy-fly
          filters:
            branches:
              only: hw-3
