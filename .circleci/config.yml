version: 2.1

#Repeatable Python Executor
executors:
  python-executor:
    docker:
      - image: cimg/python:3.14.3

orbs:
  aws-cli: circleci/aws-cli@5.4.1
#Modular Commands 
commands:
  setup-uv:
    description: "Installs and configures uv - our package manager"
    steps:
      - run: 
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
  
  install-dependencies:
    description: "Use UV to install the dependencies"
    steps:
      - run:
          name: Sync dependencies
          command: uv sync --frozen --all-packages --all-groups
  aws-setup:
    description: "Set up AWS CLI with the provided credentials"
    steps:
      - aws-cli/setup:
          role_arn: ${AWS_ROLE_ARN}
          region: ${AWS_REGION}
          role_session_name: "ospsd-session"
          session_duration: "1800"
  fly-setup:
    description: "Install and configure flyctl"
    steps:
      - run:
          name: Install flyctl
          command: |
            curl -L https://fly.io/install.sh | sh
            echo 'export FLYCTL_INSTALL="$HOME/.flyctl"' >> $BASH_ENV
            echo 'export PATH="$HOME/.flyctl/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV

jobs:
  lint:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - install-dependencies
      - run: 
          name: Ruff Check
          command: |
            uv run ruff check 
      - run:
          name: Ruff — format check
          command: uv run ruff format --check .
      - run:
          name: Mypy — strict type checking
          command: uv run mypy --strict .
  
  unit-tests:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - install-dependencies
      - run:
          name: Run component unit tests with coverage
          command: |
            mkdir -p coverage-data
            uv run coverage run --data-file=coverage-data/.coverage.unit -m pytest \
              -o addopts="--import-mode=importlib" \
              src/ \
              --junitxml=test-results/unit/results.xml \
              -v
            uv run coverage xml --data-file=coverage-data/.coverage.unit -o coverage/unit-coverage.xml
            uv run coverage html --data-file=coverage-data/.coverage.unit -d coverage/unit-html
      - store_test_results:
          path: test-results/unit
      - store_artifacts:
          path: coverage/unit-html
          destination: coverage/unit
      - persist_to_workspace:
          root: .
          paths:
            - coverage-data
  integration-tests:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - install-dependencies
      - run:
          name: Run integration tests (DI wiring verification)
          command: |
            mkdir -p coverage-data
            uv run coverage run --data-file=coverage-data/.coverage.integration -m pytest \
              -o addopts="--import-mode=importlib" \
              tests/integration/ \
              --junitxml=test-results/integration/results.xml \
              -v
            uv run coverage xml --data-file=coverage-data/.coverage.integration -o coverage/integration-coverage.xml
            uv run coverage html --data-file=coverage-data/.coverage.integration -d coverage/integration-html
      - store_test_results:
          path: test-results/integration
      - store_artifacts:
          path: coverage/integration-html
          destination: coverage/integration
      - persist_to_workspace:
          root: .
          paths:
            - coverage-data

  e2e-tests:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - install-dependencies
      - aws-setup
      - run:
          name: Run E2E tests against real AWS infrastructure
          command: |
            mkdir -p coverage-data
            uv run coverage run --data-file=coverage-data/.coverage.e2e -m pytest \
              -o addopts="--import-mode=importlib" \
              tests/e2e \
              --junitxml=test-results/e2e/results.xml \
              -v
            uv run coverage xml --data-file=coverage-data/.coverage.e2e -o coverage/e2e-coverage.xml
            uv run coverage html --data-file=coverage-data/.coverage.e2e -d coverage/e2e-html
      - store_test_results:
          path: test-results/e2e
      - store_artifacts:
          path: coverage/e2e-html
          destination: coverage/e2e
      - persist_to_workspace:
          root: .
          paths:
            - coverage-data

  ai-e2e-tests:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - install-dependencies
      - run:
          name: Run ai_server e2e tests against deployed Nimbus
          command: |
            mkdir -p coverage-data
            RUN_AI_SERVER_E2E=1 uv run coverage run --data-file=coverage-data/.coverage.ai_e2e -m pytest \
              -o addopts="--import-mode=importlib" \
              src/ai_server/tests/test_e2e.py \
              -m e2e \
              --junitxml=test-results/ai-e2e/results.xml \
              -v
            uv run coverage xml --data-file=coverage-data/.coverage.ai_e2e -o coverage/ai-e2e-coverage.xml
            uv run coverage html --data-file=coverage-data/.coverage.ai_e2e -d coverage/ai-e2e-html
      - store_test_results:
          path: test-results/ai-e2e
      - store_artifacts:
          path: coverage/ai-e2e-html
          destination: coverage/ai-e2e
      - persist_to_workspace:
          root: .
          paths:
            - coverage-data

  coverage-gate:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - install-dependencies
      - attach_workspace:
          at: .
      - run:
          name: Combine coverage and enforce project threshold
          command: |
            uv run coverage combine --data-file=.coverage coverage-data/.coverage.*
            uv run coverage report
            uv run coverage xml --data-file=.coverage -o coverage/combined-coverage.xml
            uv run coverage html --data-file=.coverage -d coverage/combined-html
      - store_artifacts:
          path: coverage/combined-html
          destination: coverage/combined

  deploy-fly:
    executor: python-executor
    steps:
      - checkout
      - fly-setup
      - run:
          name: Deploy to Fly.io
          command: |
            flyctl deploy --remote-only --config fly.toml

workflows:
  main:
    jobs:
      - lint
      - unit-tests:
          requires:
            - lint
      - integration-tests:
          requires:
            - unit-tests
      - e2e-tests:
          context: aws-ospsd
          requires:
            - integration-tests
      - ai-e2e-tests:
          context: openrouter
          requires:
            - integration-tests
      - coverage-gate:
          requires:
            - e2e-tests
            - ai-e2e-tests
      - deploy-fly:
          context: flyio
          requires:
            - coverage-gate
          filters:
            branches:
              only: hw-3
