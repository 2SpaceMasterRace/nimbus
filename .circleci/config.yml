version: 2.1

#Repeatable Python Executor
executors:
  python-executor:
    docker:
      - image: cimg/python:3.14.3

orbs:
  aws-cli: circleci/aws-cli@5.4.1
#Modular Commands 
commands:
  setup-uv:
    description: "Installs and configures uv - our package manager"
    steps:
      - run: 
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
  
  install-dependencies:
    description: "Use UV to install the dependencies"
    steps:
      - run:
          name: Sync dependencies
          command: uv sync --all-packages --all-groups
  aws-setup:
    description: "Set up AWS CLI with the provided credentials"
    steps:
      - aws-cli/setup:
          role_arn: ${AWS_ROLE_ARN}
          region: ${AWS_REGION}
          role_session_name: "ospsd-session"
          session_duration: "1800"
  fly-setup:
    description: "Install and configure flyctl"
    steps:
      - run:
          name: Install flyctl
          command: |
            export FLYCTL_INSTALL="$HOME/.fly"
            curl -L https://fly.io/install.sh | sh -s -- --non-interactive
            echo 'export FLYCTL_INSTALL="$HOME/.fly"' >> "$BASH_ENV"
            echo 'export PATH="$FLYCTL_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            flyctl version

jobs:
  lint:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - install-dependencies
      - run: 
          name: Ruff Check
          command: |
            uv run ruff check 
      - run:
          name: Ruff — format check
          command: uv run ruff format --check .
      - run:
          name: Mypy — strict type checking
          command: uv run mypy --strict .
  
  unit-tests:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - install-dependencies
      - run:
          name: Run component unit tests with coverage
          command: |
            uv run pytest \
              src/ \
              --junitxml=test-results/unit/results.xml \
              --cov-report=xml:coverage/unit-coverage.xml \
              --cov-report=html:coverage/unit-html \
              -v
      - store_test_results:
          path: test-results/unit
      - store_artifacts:
          path: coverage/unit-html
          destination: coverage/unit
  integration-tests:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - install-dependencies
      - run:
          name: Run integration tests (DI wiring verification)
          command: |
            uv run pytest \
              tests/integration/ \
              --junitxml=test-results/integration/results.xml \
              --cov-report=xml:coverage/integration-coverage.xml \
              --cov-report=html:coverage/integration-html \
              --cov-fail-under=0 \
              -v
      - store_test_results:
          path: test-results/integration
      - store_artifacts:
          path: coverage/integration-html
          destination: coverage/integration

  e2e-tests:
    executor: python-executor
    steps:
      - checkout
      - setup-uv
      - install-dependencies
      - aws-setup
      - run:
          name: Run E2E tests against real AWS infrastructure
          command: |
            uv run pytest \
              tests/e2e \
              --junitxml=test-results/e2e/results.xml \
              --cov-report=xml:coverage/e2e-coverage.xml \
              --cov-report=html:coverage/e2e-html \
              --cov-fail-under=0 \
              -v
      - store_test_results:
          path: test-results/e2e
      - store_artifacts:
          path: coverage/e2e-html
          destination: coverage/e2e

  deploy-fly:
    executor: python-executor
    steps:
      - checkout
      - fly-setup
      - run:
          name: Deploy to Fly.io
          command: |
            : "${FLY_API_TOKEN:?FLY_API_TOKEN must be set in the flyio CircleCI context}"
            flyctl auth whoami --access-token "$FLY_API_TOKEN"
            flyctl deploy --remote-only --config fly.toml --access-token "$FLY_API_TOKEN"

workflows:
  main:
    jobs:
      - lint
      - unit-tests:
          requires:
            - lint
      - integration-tests:
          requires:
            - unit-tests
      - e2e-tests:
          context: aws-ospsd
          requires:
            - integration-tests
      - deploy-fly:
          context: flyio
          requires:
            - e2e-tests
          filters:
            branches:
              only: hw-2
