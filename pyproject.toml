[project]
name = "ospsd-team-2"
version = "0.1.0"
description = "Official project of NYU's Open Source and Software Engineering class"
readme = "README.md"
authors = [
    { name = "Hari Varsha V", email = "hv2241@nyu.edu" },
    { name = "Aarav Agrawal", email = "aa10698@nyu.edu" },
    { name = "Ajay Temal", email = "at5722@nyu.edu" },
    { name = "Daniel J. Barros", email = "djb10118@nyu.edu" },
    { name = "Nicholas Maspons", email = "nem8891@nyu.edu" },
]
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.ruff]
extend-exclude = [
    "src/aws_s3_cloud_storage_service_client/aws_s3_cloud_storage_service_client",
]

[tool.uv.workspace]
members = [
    "src/aws_client_impl",
    "src/aws_client_service",
    "src/aws_client_adapter",
    "src/aws_s3_cloud_storage_service_client",
    "src/ai_client_api",
    "src/openrouter_ai_client_impl",
    "src/ai_server",
]

[tool.uv.sources]
aws-client-impl = { workspace = true }
aws-client-service = { workspace = true }
aws-client-adapter = { workspace = true }
aws-s3-cloud-storage-service-client = { workspace = true }
ai-server = { workspace = true }

[dependency-groups]
dev = [
    "boto3-stubs>=1.42.54",
    "coverage>=7.13.4",
    "httpx>=0.27.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.0",
    "furo>=2025.12.19",
    "myst-parser>=5.0.0",
    "sphinx-autobuild>=2024.10.3",
    "sphinx>=9.1.0",
    "pytest-httpserver>=1.1.5",
    "types-python-dateutil>=2.9.0.20250516",
    "types-requests>=2.33.0.20260327",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "S101",
    "INP001",
    "COM812",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Test modules: assertions are the point (S101); stub classes/methods don't
# need docstrings (D101/D102/D107); magic numbers in assertions are fine
# (PLR2004); secret-like strings in sample data are not real creds (S105);
# PT022 triggers on fixtures that yield a value for clarity even without
# teardown, which is a style choice not a bug.
# TC002: test imports (pytest, fastapi) are used at runtime, not just for
# type-checking. PT011/PT018: broad raises and compound assertions are common
# test idioms. ARG002: pytest fixtures are injected even when only needed for
# side-effects (e.g. monkeypatching env vars).
"**/test_*.py" = ["S101", "S105", "PLR2004", "D101", "D102", "D107", "PT022", "TC002", "TC003", "PT011", "PT018", "ARG002", "PLC0415"]
# conftest.py: fixtures use Any for pytest-injected types (tmp_path, monkeypatch
# variants); D103/D107 docstrings on fixtures are optional; TC002/TC003 same as tests.
"**/conftest.py" = ["D102", "D103", "D107", "ANN401", "TC002", "TC003", "ARG002"]
# CLI scripts intentionally use print for human output; TRY003/EM10* would
# force every ValueError site to define a helper constant which hurts
# readability more than it helps. PLR0913 would force kwargs-dict plumbing
# through the constructor.
"**/cli.py" = ["T201", "TRY003", "EM101", "EM102", "PLR0913", "PLR0912", "C901", "PLC0415"]
# Benchmark/smoke scripts are CLI tools: print is the output mechanism,
# magic constants are meaningful benchmark thresholds, complex scoring
# functions resist decomposition, and backslash continuation in run-with
# examples is idiomatic reStructuredText.
"**/scripts/*.py" = [
    "T201", "PLR2004", "PLR0911", "PLR0912", "C901",
    "D101", "D102", "D103", "D107",
    "TRY300", "S110", "FURB171",
    "RUF001", "E501", "D301",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
# Test directories across multiple packages share names (e.g. "tests",
# "test_auth") which causes mypy module-collision errors when the whole
# tree is checked at once.  pytest uses --import-mode=importlib so no
# __init__.py is needed; exclude these directories from mypy and rely on
# pytest + ruff for correctness checks on test code.
exclude = [
    "src/.*/tests/",
    "tests/",
]
mypy_path = [
    "src/aws_client_impl",
    "src/aws_client_service",
    "src/aws_client_adapter",
    "src/ai_server",
    "src/ai_client_api",
    "src/openrouter_ai_client_impl",
]

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/*/tests"]
addopts = ["--cov", "--cov-report=term-missing", "--import-mode=importlib"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (medium speed, real dependencies)",
    "regression: marks tests that verify previously fixed bugs have not re-emerged or core functionality hasn't degraded",
    "property: marks property-based tests (using Hypothesis) that generate a wide range of inputs to verify invariant behaviors",
    "e2e: marks tests as end-to-end tests (slow, full system)",
    "circleci: marks tests that can run in CI/CD environments without local credentials",
    "local_credentials: marks tests that require local credentials.json or token.json files",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "src/aws_s3_cloud_storage_service_client/aws_s3_cloud_storage_service_client/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/aws_client_service",
    "src/aws_client_impl",
    "src/aws_client_adapter",
]
