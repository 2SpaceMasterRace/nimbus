[project]
name = "aws-s3-cloud-storage-service-client"
version = "0.1.0"
description = "A client library for accessing AWS S3 Cloud Storage Service"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.23.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"