[project]
name = "ai-client-api"
version = "0.1.0"
description = "Provider-agnostic AI client contract with tool-calling support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_client_api"]
