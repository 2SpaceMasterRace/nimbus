[project]
name = "aws-client-adapter"
version = "0.1.0"
description = "Service adapter implementing the cloud storage API over HTTP"
requires-python = ">=3.12"
dependencies = [
    "aws-s3-cloud-storage-service-client",
    "httpx>=0.23.0",
    "cloud-storage-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aws_client_adapter"]

[tool.uv.sources]
cloud-storage-api = { git = "https://github.com/2SpaceMasterRace/ospsd-cloud-storage.git", rev = "v1.0.0" }
