[project]
name = "aws-client-adapter"
version = "0.1.0"
description = "Service adapter implementing the cloud storage API over HTTP"
requires-python = ">=3.12"
dependencies = [
    "cloud-storage-client-api",
    "aws-s3-cloud-storage-service-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aws_client_adapter"]
