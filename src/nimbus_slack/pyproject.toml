[project]
name = "nimbus-slack"
version = "0.1.0"
description = "Slack inbound bridge for Nimbus — receives Slack events and forwards them to /ai/chat/turn"
requires-python = ">=3.12"
dependencies = [
    "aws-client-impl",
    "openrouter-ai-client-impl",
    "nimbus-protocol",
    "nimbus-runtime",
    "chat-client-api",
    "boto3>=1.42.54",
    "cryptography>=47.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "structlog>=25.0.0",
    "slack-sdk>=3.0.0",
    "slack-client-impl>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nimbus_slack"]

[tool.uv.sources]
aws-client-impl = { workspace = true }
openrouter-ai-client-impl = { workspace = true }
nimbus-protocol = { workspace = true }
nimbus-runtime = { workspace = true }
chat-client-api = { git = "https://github.com/HarshithKoriRaj/Shared-API.git" }
