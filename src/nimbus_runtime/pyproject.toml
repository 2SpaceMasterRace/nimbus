[project]
name = "nimbus-runtime"
version = "0.1.0"
description = "Shared Nimbus chat/runtime orchestration for ai_server and future adapters"
requires-python = ">=3.12"
dependencies = [
    "ai-client-api",
    "cloud-storage-api",
    "pydantic>=2.9.0",
    "structlog>=25.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nimbus_runtime"]

[tool.uv.sources]
ai-client-api = { workspace = true }
cloud-storage-api = { git = "https://github.com/2SpaceMasterRace/ospsd-cloud-storage.git", rev = "v1.0.0" }
