[project]
name = "openrouter-ai-client-impl"
version = "0.1.0"
description = "OpenRouter-backed implementation of the ai-client-api contract with tool-calling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ai-client-api",
    "openai>=1.120.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.2.0",
    "typer[all]>=0.12.0",
    "structlog>=25.5.0",
    "pydantic-ai>=1.84.1",
]

[project.scripts]
nimbus = "openrouter_ai_client_impl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrouter_ai_client_impl"]

[tool.uv.sources]
ai-client-api = { workspace = true }
