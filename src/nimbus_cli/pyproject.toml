[project]
name = "nimbus-cli"
version = "0.1.0"
description = "Python command-line interface for Nimbus local and remote profiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-client-impl",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "nimbus-protocol",
    "nimbus-runtime",
    "openrouter-ai-client-impl",
    "python-dotenv>=1.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
nimbus = "nimbus_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["nimbus_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aws-client-impl = { workspace = true }
nimbus-protocol = { workspace = true }
nimbus-runtime = { workspace = true }
openrouter-ai-client-impl = { workspace = true }
