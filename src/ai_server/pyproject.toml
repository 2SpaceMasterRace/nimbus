[project]
name = "ai-server"
version = "0.1.0"
description = "FastAPI service that exposes OpenRouterClient over HTTP for Slack and other frontends"
requires-python = ">=3.12"
dependencies = [
    "ai-client-api",
    "openrouter-ai-client-impl",
    "fastapi>=0.115.0",
    "structlog>=25.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_server"]

[tool.uv.sources]
ai-client-api = { workspace = true }
openrouter-ai-client-impl = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests against the live deployed server — skipped unless AI_SERVER_BASE_URL and AI_SERVER_API_KEY are set",
]
