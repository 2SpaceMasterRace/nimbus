[project]
name = "ai-server"
version = "0.1.0"
description = "FastAPI service that exposes OpenRouterClient over HTTP for Slack and other frontends"
requires-python = ">=3.12"
dependencies = [
    "ai-client-api",
    "aws-client-impl",
    "cloud-storage-api",
    "nimbus-runtime",
    "openrouter-ai-client-impl",
    "fastapi>=0.115.0",
    "orjson>=3.9.0",
    "launchdarkly-server-sdk>=9.8.0",
    "structlog>=25.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_server"]

[tool.uv.sources]
ai-client-api = { workspace = true }
aws-client-impl = { workspace = true }
cloud-storage-api = { git = "https://github.com/2SpaceMasterRace/ospsd-cloud-storage.git", rev = "v1.0.0" }
nimbus-runtime = { workspace = true }
openrouter-ai-client-impl = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "unit: fast isolated ai_server tests",
    "e2e: end-to-end tests against the live deployed server — skipped unless AI_SERVER_BASE_URL and AI_SERVER_SIGNING_SECRET are set",
]
