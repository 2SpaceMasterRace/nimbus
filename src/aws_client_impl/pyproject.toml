[project]
name = "aws-client-impl"
version = "0.1.0"
description = "AWS S3 implementation of the cloud storage client"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.54",
    "botocore>=1.42.54",
    "cloud-storage-api",
    "requests>=2.32.5",
    "structlog>=25.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aws_client_impl"]

[tool.uv.sources]
cloud-storage-api = { git = "https://github.com/2SpaceMasterRace/ospsd-cloud-storage.git", rev = "v1.0.0" }
