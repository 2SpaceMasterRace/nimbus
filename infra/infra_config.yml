app:
  name: ospsd-team-2
  org: personal
  region: ewr

image:
  # This is the image Fly.io builds and pushes when you run `fly deploy`.
  # The tag is always "deployment-<timestamp>" in practice; "latest" is the
  # alias Fly resolves when the machine is created without an explicit tag.
  ref: registry.fly.io/ospsd-team-2:latest

vm:
  cpu_kind: shared
  cpus: 1
  memory_mb: 1024

env:
  PORT: "8080"
  AI_SESSION_DIR: "/data/sessions"

volume:
  name: nimbus_sessions
  size_gb: 1
  mount_path: /data

http_service:
  internal_port: 8080
  force_https: true
  # "off" keeps the machine always-on so session files persist in memory.
  # Change to "stop" if you add an external KV store for session state.
  auto_stop: "off"
  auto_start: true
  min_machines: 1

health_check:
  path: /health
  interval_ms: 30000
  grace_period_ms: 10000
  timeout_ms: 5000
